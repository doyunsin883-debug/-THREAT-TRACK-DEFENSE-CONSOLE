name: Validate firmware documentation and dashboard

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          python -m pip install -r python/requirements.txt
          python -m pip install -r analysis/requirements.txt
      - name: Parser unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax check
        run: python -m py_compile python/telemetry.py python/threat_track_dashboard.py analysis/generate_figures.py
      - name: Regenerate chart artifacts
        env:
          MPLBACKEND: Agg
        run: python analysis/generate_figures.py
      - name: Verify key README assets exist
        run: |
          test -s assets/screenshots/hardware-prototype.jpg
          test -s assets/screenshots/serial-monitor.jpg
          test -s assets/screenshots/dashboard-demo-screenshot.png
          test -s assets/diagrams/wiring-cad.png
          test -s assets/charts/alert-decision-map.png
          test -s docs/cad/threat-track-schematic.dxf
